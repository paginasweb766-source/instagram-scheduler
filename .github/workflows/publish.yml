name: Publicar en Instagram

on:
  schedule:
    - cron: "*/15 * * * *" # cada 15 minutos (hora UTC, GitHub puede demorar unos minutos extra)
  workflow_dispatch: {} # permite tambien correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Publicar posts vencidos
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
        run: npm run publish

      - name: Guardar cambios en posts.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/posts.csv
          git diff --staged --quiet || git commit -m "chore: actualizar estado de publicaciones"
          git push
